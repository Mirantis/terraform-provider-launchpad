name: Go

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      GOPRIVATE: github.com/Mirantis/mcc

    steps:
    - uses: actions/checkout@v3

    - name: Configure github token for private golang modules
      env:
        GH_ACCESS_TOKEN: ${{ secrets.GITHUB_ACCESS_TOKEN }}
      run: |
        echo "/github.com:_authToken=${{ secrets.GITHUB_ACCESS_TOKEN }}" >> ~/.netrc


    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
